name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint / Typecheck / Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src App.tsx index.js __tests__

      - name: Jest
        run: npm test -- --ci
